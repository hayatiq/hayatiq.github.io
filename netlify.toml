# Netlify build settings. The site needs no build; these two steps never fail the deploy:
#  - tools/asset-versions.js: versions css/js links so browsers can keep the files (_headers)
#  - tools/product-pages.js: link previews for product pages (copies the versioned index.html)
[build]
  publish = "."
  command = "node tools/asset-versions.js; node tools/product-pages.js"
